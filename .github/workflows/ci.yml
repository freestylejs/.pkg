name: CI

on:
    push:
        branches: [main, migration/oxc-turbo]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                node: [22.18.0, 24.19.0]
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.20.0
            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - run: pnpm ts:typecheck
            - run: pnpm check
            - run: pnpm test:coverage
            - run: pnpm verify:package
            - run: pnpm audit --prod --audit-level=high
